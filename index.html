<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签表幸存者数据中心</title>

    <style>
        :root {
            --bg-body: #f5f5f5;
            --bg-container: #ffffff;
            --text-main: #333333;
            --text-secondary: #7f8c8d;
            --border-color: #e0e0e0;
            --filter-row-bg: #ecf0f1;
        }

        body.dark-mode {
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --text-main: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
            --filter-row-bg: #2c2c2c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            padding: 20px;
            background: var(--bg-body);
            color: var(--text-main);
            transition: background 0.3s, color 0.3s;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: -10px;
            margin-bottom: 25px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-container);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
            transition: background 0.3s;
        }

        .theme-toggle {
            position: absolute;
            right: 20px;
            top: 20px;
            background: var(--filter-row-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .section {
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 15px;
            border-left: 4px solid #3498db;
            padding-left: 10px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .card {
            display: block;
            padding: 18px;
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-main);
            background: var(--filter-row-bg);
            border: 1px solid var(--border-color);
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            background: var(--border-color);
        }

        .footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            line-height: 1.6;
        }

        .credits {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .credits a {
            color: var(--text-main);
            text-decoration: none;
            border-bottom: 1px dashed var(--text-secondary);
            transition: all 0.2s;
        }

        .credits a:hover {
            color: #3498db;
            border-bottom-color: #3498db;
        }

        .version {
            margin-top: 8px;
            font-size: 10px;
            color: var(--text-secondary);
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .card-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

        <h1>签表幸存者数据中心</h1>
        <div class="subtitle">开发者: 哭的没分蛙</div>

        <!-- 排名查询 -->
        <div class="section">
            <div class="section-title">排名查询</div>
            <div class="card-grid">
                <a href="atp_ranking.html" class="card">ATP即时排名</a>
                <a href="wta_ranking.html" class="card">WTA即时排名</a>
                <a href="atp_race_ranking.html" class="card">ATP即时冠军排名</a>
                <a href="wta_race_ranking.html" class="card">WTA即时冠军排名</a>
            </div>
        </div>

        <!-- 幸存者杀手榜 -->
        <div class="section">
            <div class="section-title">幸存者杀手榜</div>
            <div class="card-grid">
                <a href="2026atpkiller.html" class="card">ATP杀手榜（2026）</a>
                <a href="2026wtakiller.html" class="card">WTA杀手榜（2026）</a>
                <a href="atpkiller.html" class="card">ATP杀手榜历年总榜</a>
                <a href="wtakiller.html" class="card">WTA杀手榜历年总榜</a>
            </div>
        </div>

        <!-- Credits -->
        <div class="footer">
            <div class="credits">
                数据来源：
                <a href="https://www.live-tennis.cn/zh/survivor/calendar/2026" target="_blank">
                    丘的网球
                </a>
                <br>
                特别鸣谢：
                <a href="https://zechen-3is.github.io/survivor_champion_ranking/" target="_blank">
                    旧纳
                </a>
            </div>

            <div class="version">
                测试版 | v0.2.0
            </div>
        </div>
    </div>

    <script>
    const toggleBtn = document.querySelector('.theme-toggle');

    function updateIcon() {
        if (document.body.classList.contains('dark-mode')) {
            toggleBtn.textContent = '☀️'; // show sun → switch to light
        } else {
            toggleBtn.textContent = '🌙'; // show moon → switch to dark
        }
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');

        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');

        updateIcon();
    }

    // Initial load
    (function () {
        const savedTheme = localStorage.getItem('theme');

        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
        }

        updateIcon();
    })();
</script>
</body>
</html>
