<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的关注</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
    /* surfaces — icy pale blue, AO arena daylight */
    --bg:#f0f7fb; --bg2:#e0eef6; --surface:#ffffff; --surface2:#f4fafd;
 
    /* primary: AO cyan #0088bb */
    --primary:#0088bb; --primary-dark:#005f85;
    --primary-dim:rgba(0,136,187,.10); --primary-rim:rgba(0,136,187,.28);
 
    /* secondary: US Open gold #c49800 */
    --secondary:#c49800;
    --secondary-dim:rgba(196,152,0,.10); --secondary-rim:rgba(196,152,0,.26);
 
    /* typography */
    --ink:#051420; --ink2:#0e2a3c; --muted:#4a6878; --faint:#90aabf;
 
    /* borders */
    --border:rgba(5,20,32,.10); --border2:rgba(5,20,32,.06);
 
    /* table chrome — deep navy header, bright AO cyan accent */
    --th-bg:#002d44; --th-text:#00aaee;
    --row-hover:rgba(0,136,187,.05); --row-even:rgba(5,20,32,.02);
    --filter-bg:#e6f3fa; --drop-bg:#ffffff; --track-bg:#cce6f4;
 
    /* podium medals */
    --rank1:#005f85; --rank2:#5a6e80; --rank3:#a07800;
}
body.dark {
    /* surfaces — US Open night: deep navy stadium */
    --bg:#030c14; --bg2:#071422; --surface:#0a1d30; --surface2:#102840;
 
    /* primary: bright AO cyan for night */
    --primary:#00b8f0; --primary-dark:#40d0ff;
    --primary-dim:rgba(0,184,240,.13); --primary-rim:rgba(0,184,240,.30);
 
    /* secondary: US Open gold at full brightness */
    --secondary:#f0c000;
    --secondary-dim:rgba(240,192,0,.12); --secondary-rim:rgba(240,192,0,.28);
 
    /* typography */
    --ink:#ddeef8; --ink2:#a8c8de; --muted:#5a84a0; --faint:#1e3850;
 
    /* borders */
    --border:rgba(221,238,248,.10); --border2:rgba(221,238,248,.06);
 
    /* table chrome */
    --th-bg:#010810; --th-text:#00b8f0;
    --row-hover:rgba(0,184,240,.07); --row-even:rgba(255,255,255,.025);
    --filter-bg:#071422; --drop-bg:#102840; --track-bg:#102840;
 
    /* podium medals */
    --rank1:#40d0ff; --rank2:#6a88a8; --rank3:#f0c000;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Noto Sans SC',sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;
    transition:background .3s,color .3s;
}
body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
        radial-gradient(ellipse 80% 50% at 10% 0%,rgba(224,96,64,.05) 0%,transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 100%,rgba(26,58,112,.04) 0%,transparent 55%);
}
body{padding:24px 20px 60px;}
.page{position:relative;z-index:1;max-width:1280px;margin:0 auto;}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;
    margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--border2);
    flex-wrap:wrap;gap:12px;}
.back-link{display:inline-flex;align-items:center;gap:10px;text-decoration:none;
    color:var(--muted);font-family:'Space Mono',monospace;font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;transition:color .2s;}
.back-link:hover{color:var(--primary);}
.topbar-right{display:flex;align-items:center;gap:12px;}
.updated{font-family:'Space Mono',monospace;font-size:10px;color:var(--faint);
    letter-spacing:.08em;padding:5px 10px;border:1px solid var(--border2);border-radius:3px;}
.theme-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);
    padding:7px 16px;border-radius:20px;cursor:pointer;font-size:12px;
    font-family:'Noto Sans SC',sans-serif;transition:all .2s;}
.theme-btn:hover{border-color:var(--primary);color:var(--primary);}

/* page header */
.page-header{margin-bottom:24px;}
.page-eye{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.28em;
    color:var(--primary);text-transform:uppercase;margin-bottom:10px;}
.page-title{font-family:'Noto Serif SC',serif;font-size:clamp(22px,3vw,32px);
    font-weight:700;color:var(--ink);line-height:1.2;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.ttag{font-family:'Space Mono',monospace;font-size:10px;padding:4px 10px;
    border-radius:3px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;}
.ttag-atp{background:var(--secondary-dim);color:var(--secondary);border:1px solid rgba(26,58,112,.2);}
.ttag-wta{background:var(--primary-dim);color:var(--primary-dark);border:1px solid rgba(224,96,64,.2);}
.ttag-all{background:rgba(26,26,26,.05);color:var(--muted);border:1px solid var(--border);}
body.dark .ttag-atp{border-color:rgba(111,160,224,.25);}
body.dark .ttag-wta{border-color:rgba(232,96,60,.25);}

/* ── summary bar panel ── */
.sum-box{margin-bottom:18px;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;overflow:hidden;max-width:700px;margin-left:auto;margin-right:auto;}
.sum-header{padding:10px 14px 9px;border-bottom:1px solid var(--border2);}
.sum-title{font-family:'Space Mono',monospace;font-size:10px;font-weight:500;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
.sum-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;}
.meta-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;
    border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;}
.chip-valid  {background:var(--primary-dim);color:var(--primary-dark);border:0.5px solid rgba(224,96,64,.25);}
.chip-bye    {background:rgba(46,125,92,.10);color:#2a6b4f;border:0.5px solid rgba(46,125,92,.22);}
.chip-nosel  {background:var(--surface2);color:var(--muted);border:0.5px solid var(--border);}
.chip-suicide{background:rgba(192,72,48,.10);color:var(--primary-dark);border:0.5px solid rgba(192,72,48,.22);}
.chip-live   {background:rgba(184,122,42,.10);color:#8a5a18;border:0.5px solid rgba(184,122,42,.24);}
.chip-alive  {background:rgba(46,125,92,.10);color:#2a6b4f;border:0.5px solid rgba(46,125,92,.22);}
.chip-out    {background:rgba(120,124,132,.10);color:#6a7078;border:0.5px solid rgba(120,124,132,.22);}
.chip-live .sdot,.chip-alive .sdot,.chip-out .sdot{
    width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0;}
.chip-live .sdot{background:#c4892e;}
.chip-alive .sdot{background:#2f8a62;}
.chip-out .sdot{background:#8a9098;}
body.dark .chip-valid  {border-color:rgba(232,96,60,.32);}
body.dark .chip-bye    {background:rgba(72,168,120,.14);color:#7dcea0;border-color:rgba(72,168,120,.28);}
body.dark .chip-suicide{color:var(--primary-dark);}
body.dark .chip-live   {background:rgba(212,160,72,.14);color:#e0b56a;border-color:rgba(212,160,72,.28);}
body.dark .chip-alive  {background:rgba(72,168,120,.14);color:#7dcea0;border-color:rgba(72,168,120,.28);}
body.dark .chip-out    {background:rgba(150,156,164,.12);color:#a8adb4;border-color:rgba(150,156,164,.24);}
body.dark .chip-live .sdot{background:#e0b56a;}
body.dark .chip-alive .sdot{background:#7dcea0;}
body.dark .chip-out .sdot{background:#a8adb4;}
.meta-sep  {font-size:11px;color:var(--faint);}
.meta-total{font-size:12px;color:var(--ink);font-weight:500;}
/* early-retirement backup nested under pick rows */
.tag-bak{background:rgba(184,122,42,.10);color:#8a5a18;border:0.5px solid rgba(184,122,42,.22);}
.sbar-row.is-bak .sbar-dot{background:#c4892e;opacity:1;box-shadow:0 0 0 2px rgba(196,137,46,.16);}
.sbar-row.is-bak .sbar-label{color:#7a4e14;font-weight:500;}
.seg-bak{background:#c4892e;}
.sbar-track.solo-bak{background:rgba(184,122,42,.12);}
.sbar-bak{display:flex;align-items:center;gap:8px;padding:2px 14px 4px;
    font-size:12px;color:var(--muted);}
.sbar-bak.s-hidden{display:none;}
.sbar-bak-main{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;
    padding-left:22px;min-width:0;}
.bak-arrow{color:var(--faint);font-size:12px;flex-shrink:0;}
.bak-alt{font-size:12px;color:var(--ink);min-width:3.5em;}
.bak-chips{display:inline-flex;flex-wrap:wrap;gap:4px;}
body.dark .tag-bak{background:rgba(212,160,72,.14);color:#e0b56a;border-color:rgba(212,160,72,.28);}
body.dark .sbar-row.is-bak .sbar-dot{background:#e0b56a;box-shadow:0 0 0 2px rgba(224,181,106,.16);}
body.dark .sbar-row.is-bak .sbar-label{color:#ead0a0;}
body.dark .seg-bak{background:#e0b56a;}
/* col header */
.sum-col-hd{display:flex;align-items:center;gap:8px;padding:5px 14px 3px;}
.sch-rank{width:16px;flex-shrink:0;}
.sch-name{width:190px;flex-shrink:0;}
.sch-bar{flex:1;}
.sch-right{display:flex;align-items:center;gap:3px;flex-shrink:0;}
.sch-tag{font-size:10px;font-weight:500;padding:1px 6px;border-radius:10px;white-space:nowrap;}
.sch-tag-v{background:var(--primary-dim);color:var(--primary-dark);border:0.5px solid rgba(224,96,64,.25);}
.sch-tag-b{background:rgba(46,125,92,.10);color:#2a6b4f;border:0.5px solid rgba(46,125,92,.22);}
body.dark .sch-tag-v{border-color:rgba(232,96,60,.32);}
body.dark .sch-tag-b{background:rgba(72,168,120,.14);color:#7dcea0;border-color:rgba(72,168,120,.28);}
.sch-sep  {font-size:11px;color:var(--faint);}
.sch-count{font-size:11px;color:var(--faint);width:30px;text-align:right;}
.sch-pct  {font-size:11px;color:var(--faint);width:42px;text-align:right;}
/* bar rows */
.sum-list{padding:4px 0;}
.sbar-row{display:flex;align-items:center;gap:8px;padding:5px 14px;transition:background .12s;}
.sbar-row:hover{background:var(--surface2);}
.sbar-rank{font-size:11px;color:var(--faint);width:16px;text-align:right;
    flex-shrink:0;font-variant-numeric:tabular-nums;}
.sbar-name{font-size:13px;color:var(--ink);width:190px;flex-shrink:0;
    display:inline-flex;align-items:center;gap:5px;min-width:0;}
.sbar-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;
    background:var(--faint);opacity:.55;}
.sbar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.sbar-tag{font-size:9px;font-weight:500;letter-spacing:.04em;padding:1px 5px;
    border-radius:8px;flex-shrink:0;line-height:1.35;white-space:nowrap;}
.tag-live{background:rgba(184,122,42,.10);color:#8a5a18;border:0.5px solid rgba(184,122,42,.22);}
.tag-alive{background:rgba(46,125,92,.10);color:#2a6b4f;border:0.5px solid rgba(46,125,92,.20);}
.tag-out{background:rgba(120,124,132,.10);color:#6a7078;border:0.5px solid rgba(120,124,132,.20);}
.sbar-row.is-live .sbar-dot{background:#c4892e;opacity:1;box-shadow:0 0 0 2px rgba(196,137,46,.16);}
.sbar-row.is-live .sbar-label{color:#7a4e14;font-weight:500;}
.sbar-row.is-alive .sbar-dot{background:#2f8a62;opacity:1;box-shadow:0 0 0 2px rgba(47,138,98,.14);}
.sbar-row.is-alive .sbar-label{color:#1f4f3a;font-weight:500;}
.sbar-row.is-out{opacity:.92;}
.sbar-row.is-out .sbar-dot{background:#9aa0a8;opacity:1;}
.sbar-row.is-out .sbar-label{color:var(--muted);}
.sbar-row.is-out .sbar-count,.sbar-row.is-out .sbar-pct{color:var(--muted);}
body.dark .tag-live{background:rgba(212,160,72,.14);color:#e0b56a;border-color:rgba(212,160,72,.28);}
body.dark .tag-alive{background:rgba(72,168,120,.14);color:#7dcea0;border-color:rgba(72,168,120,.28);}
body.dark .tag-out{background:rgba(150,156,164,.12);color:#a8adb4;border-color:rgba(150,156,164,.24);}
body.dark .sbar-row.is-live .sbar-dot{background:#e0b56a;box-shadow:0 0 0 2px rgba(224,181,106,.16);}
body.dark .sbar-row.is-live .sbar-label{color:#ead0a0;}
body.dark .sbar-row.is-alive .sbar-dot{background:#7dcea0;box-shadow:0 0 0 2px rgba(125,206,160,.16);}
body.dark .sbar-row.is-alive .sbar-label{color:#b7e0c8;}
body.dark .sbar-row.is-out .sbar-dot{background:#8a9098;}
.sbar-track{flex:1;background:var(--surface2);border-radius:20px;height:8px;
    display:flex;overflow:hidden;}
body.dark .sbar-track{background:var(--bg2);}
.sbar-seg{height:100%;transition:width .38s cubic-bezier(.4,0,.2,1);}
.seg-v{background:var(--primary);}
.seg-b{background:#2f8a62;}
.seg-live{background:linear-gradient(90deg,#d4a04a,#c4892e);}
.seg-alive{background:linear-gradient(90deg,#3fa873,#2f8a62);}
.seg-out{background:linear-gradient(90deg,rgba(140,146,154,.55),rgba(140,146,154,.38));}
body.dark .seg-b{background:#7dcea0;}
body.dark .seg-live{background:linear-gradient(90deg,#e0b56a,#c4892e);}
body.dark .seg-alive{background:linear-gradient(90deg,#5fbf8a,#3fa873);}
body.dark .seg-out{background:linear-gradient(90deg,rgba(130,136,144,.45),rgba(130,136,144,.28));}
/* One bar shape for every status: the track clips the ends, segments are flat.
   Bye part is always alive-coloured; once settled alive the whole bar is one
   solid colour and the bye part is only marked with a stripe overlay. */
.sbar-track.solo-alive .sbar-seg{background:#35a06f;}
body.dark .sbar-track.solo-alive .sbar-seg{background:#4fb582;}
.sbar-track.solo-alive .seg-bye{background:repeating-linear-gradient(135deg,rgba(255,255,255,.42) 0 2px,transparent 2px 5px),#35a06f;}
body.dark .sbar-track.solo-alive .seg-bye{background:repeating-linear-gradient(135deg,rgba(255,255,255,.32) 0 2px,transparent 2px 5px),#4fb582;}
.sbar-inline{display:flex;align-items:center;gap:2px;flex-shrink:0;
    font-size:12px;font-variant-numeric:tabular-nums;width:60px;justify-content:flex-end;}
.sbar-iv{color:var(--primary-dark);font-weight:500;}
.sbar-ib{color:var(--secondary);font-weight:500;}
body.dark .sbar-iv{color:var(--primary-dark);}
body.dark .sbar-ib{color:var(--secondary);}
.sbar-isep{font-size:11px;color:var(--faint);}
.sbar-right{display:flex;align-items:center;flex-shrink:0;}
.sbar-count{font-size:13px;font-weight:500;color:var(--ink);
    width:28px;text-align:right;font-variant-numeric:tabular-nums;}
.sbar-pct{font-size:12px;color:var(--faint);width:42px;text-align:right;
    font-variant-numeric:tabular-nums;}
/* totals row */
.sbar-row.stotal{border-top:1px solid var(--border2);margin-top:2px;
    padding-top:8px;padding-bottom:8px;}
.sbar-row.stotal .sbar-name{font-size:12px;color:var(--muted);}
.sbar-row.stotal .sbar-dot,.sbar-row.stotal .sbar-tag{display:none;}
.sbar-row.stotal .sbar-count{color:var(--primary);}
/* hidden / expanded rows */
.sbar-row.s-hidden{display:none;}
.sbar-row.s-hidden.s-exp{display:flex;}
/* toggle */
.sum-toggle{width:100%;padding:9px 14px;border:none;
    border-top:1px solid var(--border2);background:var(--surface2);
    color:var(--muted);font-size:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:background .15s,color .15s;font-family:'Noto Sans SC',sans-serif;}
.sum-toggle:hover{color:var(--primary);}
.sum-ticon{font-size:10px;display:inline-block;transition:transform .25s;}
.sum-toggle.open .sum-ticon{transform:rotate(180deg);}
/* copy button */
.sum-copy-btn{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 10px;border-radius:20px;cursor:pointer;
    border:1px solid var(--border);background:var(--surface2);
    color:var(--muted);font-size:11px;font-family:'Space Mono',monospace;
    letter-spacing:.04em;transition:all .18s;flex-shrink:0;
    white-space:nowrap;
}
.sum-copy-btn:hover{border-color:var(--primary-rim);color:var(--primary-dark);}
.sum-copy-btn.copied{border-color:var(--primary-rim);color:var(--primary-dark);
    background:var(--primary-dim);}
body.dark .sum-copy-btn.copied{color:var(--primary);}
.sum-title-row{display:flex;align-items:center;justify-content:space-between;
    gap:8px;margin-bottom:7px;}

/* daily killer panel (F7) */
.dk-box{margin:0 auto 18px;max-width:700px;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.dk-toggle{width:100%;padding:10px 14px;border:none;background:var(--surface2);
    color:var(--muted);font-size:12px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:color .15s,background .15s;}
.dk-toggle:hover{color:var(--primary);}
.dk-arrow{font-size:10px;display:inline-block;transition:transform .25s;}
.dk-box.open .dk-arrow{transform:rotate(180deg);}
.dk-body{display:none;border-top:1px solid var(--border2);padding:8px 0 10px;}
.dk-box.open .dk-body{display:block;}
.dk-hd{display:grid;grid-template-columns:56px 1fr 1fr;gap:8px;padding:4px 14px 6px;
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--faint);}
.dk-row{display:grid;grid-template-columns:56px 1fr 1fr;gap:8px;padding:7px 14px;
    align-items:center;border-top:1px solid var(--border2);}
.dk-row:hover{background:var(--surface2);}
.dk-day{font-family:'Space Mono',monospace;font-size:11px;color:var(--faint);}
.dk-killers{display:contents;}
.dk-k{font-size:13px;color:var(--ink);display:flex;align-items:baseline;gap:6px;min-width:0;}
.dk-k b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dk-k em{font-style:normal;font-family:'Space Mono',monospace;font-size:11px;
    color:var(--primary-dark);font-weight:700;flex-shrink:0;}
.dk-k.alt em{color:var(--secondary);}
body.dark .dk-k em{color:var(--primary);}
body.dark .dk-k.alt em{color:var(--secondary);}
@media(max-width:640px){
    .dk-hd,.dk-row{grid-template-columns:44px 1fr; }
    .dk-hd-k:last-child,.dk-row .dk-k.alt{display:none;}
}

/* stats row */
.stats-row{display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.row-count{font-family:'Space Mono',monospace;font-size:11px;
    color:var(--faint);letter-spacing:.08em;}
.row-count b{color:var(--primary);font-weight:700;}

/* table wrapper */
.table-wrapper{max-height:72vh;overflow-y:auto;overflow-x:auto;
    border:1px solid var(--border2);border-radius:6px;}
.table-wrapper::-webkit-scrollbar{width:5px;height:5px;}
.table-wrapper::-webkit-scrollbar-track{background:transparent;}
.table-wrapper::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* filterable table */
.filterable-table{width:100%;border-collapse:collapse;font-size:12px;}
.filterable-table thead tr:first-child th{
    background:var(--th-bg);color:var(--th-text);
    padding:11px 10px;text-align:left;font-weight:500;
    position:sticky;top:0;z-index:20;cursor:pointer;
    user-select:none;white-space:nowrap;
    font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;
    border-bottom:1px solid rgba(232,84,26,.3);transition:color .15s;}
.filterable-table thead tr:first-child th:hover{color:#E8541A;}
.filterable-table td{padding:8px 10px;border-bottom:1px solid var(--border2);
    vertical-align:middle;color:var(--ink);font-size:12px;}
.filterable-table tr:hover td{background:var(--row-hover);}
.filterable-table tr:nth-child(even) td{background:var(--row-even);}
.filterable-table tr:nth-child(even):hover td{background:var(--row-hover);}

/* filter row */
.filter-row{background:var(--filter-bg) !important;position:sticky;z-index:19;}
.filter-row th{padding:3px 4px;background:var(--filter-bg) !important;
    cursor:default;border-bottom:1px solid var(--border);}
.filter-dropdown{position:relative;width:100%;}
.filter-trigger{width:100%;padding:3px 5px;border:1px solid var(--border);
    border-radius:3px;background:var(--drop-bg);color:var(--muted);font-size:10px;
    cursor:pointer;display:flex;justify-content:space-between;align-items:center;
    font-family:'Space Mono',monospace;letter-spacing:.04em;transition:border-color .15s;}
.filter-trigger:hover{border-color:var(--primary);color:var(--ink2);}
.dropdown-content{display:none;position:fixed;background:var(--drop-bg);
    min-width:160px;max-height:240px;overflow-y:auto;
    border:1px solid var(--border);border-radius:4px;
    box-shadow:0 8px 24px rgba(26,26,26,.12);z-index:9999;}
body.dark .dropdown-content{box-shadow:0 8px 24px rgba(0,0,0,.4);}
.dropdown-content.show{display:block;}
.option-item{padding:7px 10px;cursor:pointer;display:flex;align-items:center;
    gap:8px;font-size:12px;border-bottom:1px solid var(--border2);
    color:var(--ink2);transition:background .12s;}
.option-item:last-child{border-bottom:none;}
.option-item:hover{background:var(--row-hover);}
.option-item input[type=checkbox]{margin:0;accent-color:var(--primary);}
.dropdown-search{width:100%;padding:8px 10px;border:none;
    border-bottom:1px solid var(--border2);background:var(--drop-bg);
    color:var(--ink);font-size:12px;outline:none;}
.dropdown-search::placeholder{color:var(--faint);}
.dropdown-search:focus{border-bottom-color:var(--primary);}
th.sort-asc::after{content:" ▲";font-size:9px;}
th.sort-desc::after{content:" ▼";font-size:9px;}

/* rank change badges */
.rank{font-weight:600;display:inline-flex;align-items:center;gap:3px;font-size:11px;}
.rank.up{color:#2a7a4a;}
.rank.down{color:#c04830;}
.rank.same{color:var(--muted);}

/* user status: 存活 / 未完赛·未选 / 淘汰(含自杀·球员输球) */
.st-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;
    border-radius:10px;font-size:11px;font-weight:500;line-height:1.35;
    white-space:nowrap;border:0.5px solid transparent;}
.st-badge::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.st-alive{background:rgba(46,125,92,.10);color:#2a6b4f;border-color:rgba(46,125,92,.22);}
.st-alive::before{background:#2f8a62;}
.st-live{background:rgba(184,122,42,.10);color:#8a5a18;border-color:rgba(184,122,42,.22);}
.st-live::before{background:#c4892e;}
.st-out{background:rgba(120,124,132,.10);color:#6a7078;border-color:rgba(120,124,132,.22);}
.st-out::before{background:#9aa0a8;}
.st-other{background:rgba(120,124,132,.10);color:#6a7078;border-color:rgba(120,124,132,.22);}
.st-other::before{background:#9aa0a8;}
body.dark .st-alive{background:rgba(72,168,120,.14);color:#7dcea0;border-color:rgba(72,168,120,.28);}
body.dark .st-alive::before{background:#7dcea0;}
body.dark .st-live{background:rgba(212,160,72,.14);color:#e0b56a;border-color:rgba(212,160,72,.28);}
body.dark .st-live::before{background:#e0b56a;}
body.dark .st-out{background:rgba(150,156,164,.12);color:#a8adb4;border-color:rgba(150,156,164,.24);}
body.dark .st-out::before{background:#a8adb4;}
body.dark .st-other{background:rgba(150,156,164,.12);color:#a8adb4;border-color:rgba(150,156,164,.24);}
body.dark .st-other::before{background:#a8adb4;}
.filterable-table tr.row-alive td:first-child{box-shadow:inset 3px 0 0 #2f8a62;}
.filterable-table tr.row-live td:first-child{box-shadow:inset 3px 0 0 #c4892e;}
.filterable-table tr.row-out td{color:var(--muted);}
.filterable-table tr.row-out td:first-child{box-shadow:inset 3px 0 0 rgba(154,160,168,.55);}
body.dark .filterable-table tr.row-alive td:first-child{box-shadow:inset 3px 0 0 #7dcea0;}
body.dark .filterable-table tr.row-live td:first-child{box-shadow:inset 3px 0 0 #e0b56a;}

/* podium (killer page) */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.pod-card{background:var(--surface);border:1px solid var(--border2);border-radius:8px;
    padding:18px 14px;text-align:center;transition:border-color .2s;}
.pod-card:hover{border-color:var(--border);}
.pod-card.p1{border-top:3px solid var(--rank1);}
.pod-card.p2{border-top:3px solid var(--rank2);}
.pod-card.p3{border-top:3px solid var(--rank3);}
.pod-medal{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;
    line-height:1;margin-bottom:8px;}
.p1 .pod-medal{color:var(--rank1);}
.p2 .pod-medal{color:var(--rank2);}
.p3 .pod-medal{color:var(--rank3);}
.pod-name{font-family:'Noto Serif SC',serif;font-size:14px;font-weight:600;
    color:var(--ink);margin-bottom:10px;}
.pod-kills{font-family:'Space Mono',monospace;font-size:24px;font-weight:700;
    color:var(--primary);line-height:1;margin-bottom:3px;}
.pod-kills-lbl{font-size:10px;color:var(--faint);letter-spacing:.08em;}
.pod-rate{margin-top:8px;font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;}

/* kill-count & rank cols */
.filterable-table td:nth-child(3){font-family:'Space Mono',monospace;font-weight:600;color:var(--primary);}
.filterable-table td:nth-child(4){font-family:'Space Mono',monospace;font-size:11px;}
.filterable-table td:first-child{font-family:'Space Mono',monospace;color:var(--faint);font-size:11px;}

/* ── numeric range-slider filter ── */
.filter-slider{padding:10px 12px 12px;min-width:190px;}
.filter-slider-readout{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin-bottom:10px;font-family:'Space Mono',monospace;font-size:11px;
    color:var(--ink2);
}
.filter-slider-readout input[type=number]{
    width:58px;padding:3px 5px;border:1px solid var(--border);border-radius:3px;
    background:var(--drop-bg);color:var(--ink);font-size:11px;text-align:center;
    font-family:'Space Mono',monospace;
}
.filter-slider-readout input[type=number]:focus{outline:none;border-color:var(--primary);}
.filter-slider-sep{color:var(--faint);}
.filter-slider-range{position:relative;height:28px;}
.filter-slider-track{
    position:absolute;top:12px;left:0;right:0;height:4px;
    background:var(--border2);border-radius:2px;
}
.filter-slider-fill{
    position:absolute;top:12px;height:4px;background:var(--primary);border-radius:2px;
}
.filter-slider-range input[type=range]{
    position:absolute;top:0;left:0;width:100%;height:28px;margin:0;
    background:transparent;-webkit-appearance:none;appearance:none;pointer-events:none;
}
.filter-slider-range input[type=range]::-webkit-slider-thumb{
    pointer-events:auto;-webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:var(--primary);border:2px solid var(--surface);
    cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.35);margin-top:8px;
}
.filter-slider-range input[type=range]::-moz-range-thumb{
    pointer-events:auto;width:14px;height:14px;border-radius:50%;
    background:var(--primary);border:2px solid var(--surface);cursor:pointer;
}
.filter-slider-reset{
    width:100%;margin-top:4px;padding:5px 0;border:1px solid var(--border);
    border-radius:3px;background:var(--surface2);color:var(--muted);
    font-size:10px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;
    transition:all .15s;
}
.filter-slider-reset:hover{border-color:var(--primary);color:var(--primary);}

/* detail modal */
.detail-modal{
    position:fixed;inset:0;z-index:9999;
    background:rgba(0,0,0,0);
    display:none;align-items:center;justify-content:center;padding:18px;
    transition:background .22s;
}
.detail-modal.show{display:flex;background:rgba(0,0,0,.52);}
.detail-card{
    width:min(560px,96vw);max-height:85vh;
    background:var(--surface);
    border:1px solid var(--border);border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.28),0 4px 12px rgba(0,0,0,.12);
    display:flex;flex-direction:column;overflow:hidden;
    transform:translateY(14px) scale(.97);opacity:0;
    transition:transform .26s cubic-bezier(.22,.68,0,1.2),opacity .22s;
}
body.dark .detail-card{box-shadow:0 20px 60px rgba(0,0,0,.55),0 4px 12px rgba(0,0,0,.3);}
.detail-modal.show .detail-card{transform:translateY(0) scale(1);opacity:1;}
.detail-hd{
    flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:16px 18px 14px;
    background:var(--th-bg);
}
.detail-title-wrap{display:flex;align-items:center;gap:10px;}
.detail-icon{
    width:30px;height:30px;border-radius:8px;
    background:var(--primary-dim);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;flex-shrink:0;
}
.detail-title{
    font-family:'Noto Serif SC',serif;font-size:15px;font-weight:600;
    color:var(--th-text);letter-spacing:.02em;
}
.detail-meta{font-family:'Space Mono',monospace;font-size:10px;color:var(--faint);margin-top:2px;}
.detail-close{
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);
    color:rgba(255,255,255,.5);
    border-radius:8px;padding:5px 11px;cursor:pointer;font-size:12px;
    transition:all .18s;line-height:1.4;flex-shrink:0;
}
.detail-close:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-dim);}
.detail-scroll{overflow-y:auto;padding:10px 10px 14px;}
.detail-scroll::-webkit-scrollbar{width:4px;}
.detail-scroll::-webkit-scrollbar-track{background:transparent;}
.detail-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.detail-list{display:grid;gap:5px;padding:4px 2px;}
.detail-empty{
    padding:28px 0;text-align:center;
    font-size:13px;color:var(--faint);font-family:'Space Mono',monospace;
    letter-spacing:.06em;
}
.detail-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 12px;border-radius:8px;
    border:1px solid var(--border2);background:var(--surface2);
    transition:background .12s,border-color .12s;
}
.detail-item:hover{background:var(--row-hover);border-color:var(--border);}
.detail-day{
    font-family:'Space Mono',monospace;font-size:10px;font-weight:700;
    color:var(--primary);letter-spacing:.06em;
    min-width:44px;flex-shrink:0;
    padding:3px 7px;border-radius:5px;
    background:var(--primary-dim);border:0.5px solid rgba(224,96,64,.22);
    text-align:center;
}
body.dark .detail-day{border-color:rgba(232,96,60,.28);}
.detail-val{font-size:13px;color:var(--ink);line-height:1.4;flex:1;}
.detail-footer{
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    padding:10px 18px 12px;
    border-top:1px solid var(--border2);
    font-family:'Space Mono',monospace;font-size:10px;color:var(--faint);
    letter-spacing:.06em;
}
.filterable-table tbody tr{cursor:pointer;}
.filterable-table tbody tr:hover td{background:var(--row-hover);}

@media(max-width:640px){
    body{padding:14px 12px 40px;}
    .topbar{margin-bottom:18px;}
    .page-title{font-size:20px;}
    .filterable-table{font-size:11px;}
    .filterable-table thead tr:first-child th,
    .filterable-table td{padding:5px 6px;white-space:nowrap;}
    .table-wrapper{max-height:62vh;}
    .podium{grid-template-columns:1fr;}
    .sch-name,.sbar-name{width:112px;}
    .sbar-tag{display:none;}
}
.route-entry{display:flex;align-items:center;gap:14px;background:var(--surface);
    border:1px solid var(--border);border-radius:8px;padding:14px 18px;
    cursor:pointer;margin-bottom:18px;transition:border-color .15s,transform .15s;}
.route-entry:hover{border-color:var(--primary-rim);transform:translateY(-1px);}
.route-entry-icon{width:34px;height:34px;border-radius:8px;background:var(--primary-dim);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
.route-entry-text{flex:1;}
.route-entry-title{font-family:'Noto Serif SC',serif;font-size:14px;font-weight:600;color:var(--ink);}
.route-entry-desc{font-size:11.5px;color:var(--muted);margin-top:2px;}
.route-entry-arrow{font-size:15px;color:var(--faint);transition:transform .15s;}
.route-entry:hover .route-entry-arrow{transform:translateX(3px);color:var(--primary);}

.rq-select-box{border:1px solid var(--border);border-radius:6px;background:var(--surface2);
    margin-bottom:10px;overflow:hidden;}
.rq-search{width:100%;border:none;background:transparent;padding:8px 10px;font-size:12px;
    border-bottom:1px solid var(--border2);box-sizing:border-box;color:var(--ink);outline:none;
    font-family:'Noto Sans SC',sans-serif;}
.rq-search::placeholder{color:var(--faint);}
.rq-opt-list{max-height:160px;overflow-y:auto;}
.rq-opt{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;cursor:pointer;
    border-bottom:1px solid var(--border2);color:var(--ink2);transition:background .12s;}
.rq-opt:last-child{border-bottom:none;}
.rq-opt:hover{background:var(--row-hover);}
.rq-opt.sel{background:var(--primary-dim);}
.rq-opt input[type=checkbox]{margin:0;accent-color:var(--primary);pointer-events:none;}
.rq-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;min-height:24px;}
.rq-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;
    font-size:11px;background:var(--primary-dim);color:var(--primary-dark);
    border:0.5px solid var(--primary-rim);}
.rq-tag-rm{cursor:pointer;opacity:.65;font-size:11px;}
.rq-tag-rm:hover{opacity:1;}
.rq-run-btn{width:100%;background:var(--primary);color:#fff;border:none;padding:9px;
    border-radius:6px;font-size:13px;cursor:pointer;margin-bottom:16px;
    font-family:'Noto Sans SC',sans-serif;transition:background .15s;}
.rq-run-btn:hover{background:var(--primary-dark);}
.rq-result-count{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;
    color:var(--faint);margin-bottom:8px;}
.rq-result-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;}
.rq-result-row{display:flex;align-items:center;gap:10px;padding:8px 12px;
    border:1px solid var(--border2);background:var(--surface2);border-radius:8px;}
.rq-badge{font-size:9px;font-weight:700;color:var(--primary-dark);background:var(--primary-dim);
    padding:2px 7px;border-radius:5px;flex-shrink:0;white-space:nowrap;}
.rq-result-name{flex:1;font-size:12.5px;color:var(--ink);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
.rq-result-pick{font-size:11px;color:var(--faint);flex-shrink:0;white-space:nowrap;}
.rq-result-pick b{color:var(--ink);font-weight:500;}
.rq-empty{padding:28px 0;text-align:center;font-size:12.5px;color:var(--faint);
    font-family:'Space Mono',monospace;letter-spacing:.04em;}

@media(max-width:640px){
    .rq-result-pick{white-space:normal;}
}
.site-hd{display:flex;align-items:center;gap:20px;margin-bottom:28px;padding-bottom:14px;
    border-bottom:1px solid var(--border2);}
.site-hd .back-link{min-height:44px;flex-shrink:0;}
.hd-tabs{display:flex;gap:2px;font-size:14px;min-width:0;}
.hd-tab{display:flex;align-items:center;min-height:44px;padding:0 12px;color:var(--muted);text-decoration:none;
    white-space:nowrap;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.hd-tab:hover{color:var(--primary);}
.hd-tab[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--primary);}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.hd-seg{display:flex;gap:3px;padding:3px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;}
.hd-seg-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 16px;
    border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;transition:background .18s,color .18s;}
a.hd-seg-btn:hover{color:var(--primary);}
.hd-seg-btn[aria-current="page"],.hd-seg-btn[aria-current="page"]:hover{background:#1c3f94;color:#ffffff;}
.hd-seg-btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;}
.hd-seg-btn[data-tip]:hover::after,.hd-seg-btn[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;
    top:calc(100% + 8px);right:0;white-space:nowrap;background:var(--th-bg);color:#ddeef8;font-size:12px;font-weight:400;
    padding:6px 10px;border-radius:8px;z-index:30;opacity:1;}
.hd-live{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;font-size:12px;color:var(--ink2);
    border:1px solid var(--border);border-radius:999px;background:var(--surface);white-space:nowrap;}
.hd-time{font-family:'Space Mono',monospace;}
.hd-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;animation:hdPulse 1.8s ease-out infinite;}
@keyframes hdPulse{0%{box-shadow:0 0 0 0 var(--primary-rim)}100%{box-shadow:0 0 0 9px transparent}}
.site-hd .theme-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;font-size:13px;
    color:var(--ink2);border-radius:999px;}
.theme-btn .ic-sun,body.dark .theme-btn .ic-moon{display:none;}
body.dark .theme-btn .ic-sun{display:block;}
.to-top{position:fixed;right:24px;bottom:24px;z-index:40;width:48px;height:48px;border-radius:50%;
    border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;
    animation:hdRise .22s ease-out both;}
.to-top[hidden]{display:none;}
.to-top:hover{border-color:var(--primary);color:var(--primary);}
@keyframes hdRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.site-hd a:focus-visible,.site-hd button:focus-visible,.hd-seg-btn:focus-visible,.to-top:focus-visible{
    outline:2px solid var(--primary);outline-offset:2px;}

@media(max-width:1100px){
    .site-hd{flex-wrap:wrap;row-gap:6px;}
    .hd-tabs{order:3;flex:1 0 100%;overflow-x:auto;scrollbar-width:none;}
    .hd-tabs::-webkit-scrollbar{display:none;}
}
@media(max-width:720px){
    .site-hd{gap:8px;margin-bottom:18px;padding-bottom:0;}
    .hd-right{display:contents;}
    .hd-live{margin-left:auto;padding:0 10px;min-height:36px;}
    .hd-suffix{display:none;}
    .site-hd .theme-btn{width:44px;height:44px;padding:0;justify-content:center;}
    .site-hd .theme-label{display:none;}
    .hd-seg{order:2;flex:1 0 100%;}
    .hd-seg-btn{flex:1;min-height:40px;font-size:14px;}
    .hd-tabs{margin:0 -12px;padding:0 12px;
        -webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);}
    .hd-seg-btn[data-tip]:hover::after,.hd-seg-btn[data-tip]:focus-visible::after{right:auto;left:50%;transform:translateX(-50%);}
    .to-top{right:16px;bottom:20px;}
}
@media(prefers-reduced-motion:reduce){
    .hd-dot,.to-top{animation:none;}
    .hd-tab,.hd-seg-btn{transition:none;}
}
.rk,.rk-modal,.rk-picker{--tour:var(--secondary);--ok:#1e6b47;--ok-bg:#e3f3ea;--bad:#9a3a28;--bad-bg:#f8e3dd;--me:#1c3f94;
    --me-dim:rgba(28,63,148,.07);--me-rim:rgba(28,63,148,.30);--star:#c49800;--star-dim:rgba(196,152,0,.10);--star-rim:rgba(196,152,0,.35);
}
.rk{display:flex;flex-direction:column;gap:20px;}
.rk,.rk-modal{--fin:var(--primary);--fin-dim:var(--primary-dim);--fin-rim:var(--primary-rim);}
.rk[data-tour="WTA"],.rk-modal[data-tour="WTA"]{--tour:var(--primary);}
body.dark .rk,body.dark .rk-modal,body.dark .rk-picker{--ok:#7dcea0;--ok-bg:rgba(72,168,120,.14);--bad:#ff9a7a;--bad-bg:rgba(255,122,84,.12);--me:#8fb0ff;
    --me-dim:rgba(143,176,255,.10);--me-rim:rgba(143,176,255,.34);--star:#f0c000;--star-dim:rgba(240,192,0,.10);--star-rim:rgba(240,192,0,.32);}
.page-header{border-left:3px solid var(--tour,var(--primary));padding-left:18px;}
.rk-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.rk-eye{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.rk-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;}
.rk button,.rk-modal button,.rk-picker button{font-family:inherit;cursor:pointer;}
.rk-modal button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.rk button:focus-visible,.rk a:focus-visible,.rk input:focus-visible,.rk-picker button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.rk-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;
    border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;white-space:nowrap;}
.rk-btn:hover{border-color:var(--primary-rim);color:var(--primary-dark);}
.rk-btn-sm{min-height:36px;padding:0 12px;}
.rk-btn-pri{background:var(--me);border-color:var(--me);color:#fff;font-weight:700;}
.rk-btn-pri:hover{color:#fff;border-color:var(--me);filter:brightness(1.08);}
body.dark .rk-btn-pri{color:#06142a;}
.rk-btn-block{width:100%;}
.rk-btn-text{border:0;background:transparent;color:var(--muted);font-size:12px;min-height:36px;padding:0 8px;}
.rk-btn-text:hover{color:var(--primary-dark);}
.rk-input{font:inherit;font-size:14px;min-height:40px;border:1px solid var(--border);border-radius:10px;padding:0 12px;
    background:var(--drop-bg);color:var(--ink);min-width:0;}
.rk-note{font-size:12px;color:var(--muted);}

/* top row: picks summary + aside */
.rk-top{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:stretch;}
.rk-aside{display:flex;flex-direction:column;gap:16px;min-width:0;}
.rk-top-solo{grid-template-columns:minmax(0,1fr);}
.rk-top-solo .rk-aside{display:block;}
.rk-top-solo .rk-me{display:grid;grid-template-columns:200px minmax(0,1fr);align-items:center;column-gap:24px;row-gap:8px;padding:16px 20px;}
.rk-top-solo .rk-me-hd{flex-direction:column;align-items:flex-start;gap:4px;}
.rk-top-solo .rk-me-set{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 16px;}
.rk-top-solo .rk-me-set .rk-me-row{flex:0 1 360px;}
.rk-top-solo .rk-me-body{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px 20px;}
.rk-top-solo .rk-me-rank{font-size:32px;}
.rk-top-solo .rk-me-pick{flex:1 1 220px;}
.rk-top-solo .rk-btn-block{width:auto;}
@media(max-width:720px){.rk-top-solo .rk-me{grid-template-columns:minmax(0,1fr);}}
.rk .sum-box{max-width:none;margin:0;border-radius:12px;border-top:3px solid var(--tour);transition:transform .2s ease-out,box-shadow .2s ease-out;}
.rk .sum-header{padding:18px 22px 12px;}
.rk .sum-title{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);margin:0;}
.rk .sum-title::before{content:"TODAY'S PICKS";display:block;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
    letter-spacing:.2em;color:var(--tour);margin-bottom:4px;}
.rk .sum-title-row{align-items:flex-end;margin-bottom:12px;}
.rk .meta-chip{font-size:12px;padding:3px 10px;}
.rk .sum-col-hd,.rk .sbar-row,.rk .sbar-bak{padding-left:22px;padding-right:22px;}
.rk .sbar-name{font-size:14px;}
.rk .sbar-track{height:10px;}
.rk .sum-toggle{min-height:44px;font-size:13px;color:var(--primary-dark);}
.rk .sum-copy-btn{min-height:40px;min-width:100px;justify-content:center;padding:0 14px;font-family:'Noto Sans SC',sans-serif;
    font-size:12px;font-weight:700;color:var(--ink2);background:var(--surface);overflow:hidden;
    transition:background-color .2s ease-out,border-color .2s ease-out,color .2s ease-out;}
.rk .sum-copy-btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;animation:rkPress .24s ease-out;}
body.dark .rk .sum-copy-btn.ok{color:#06140c;}
.rk .sum-copy-btn.err{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}
.rk .sum-copy-btn .cp-in{display:inline-flex;align-items:center;gap:6px;}
.rk .sum-copy-btn.ok .cp-in{animation:rkUp .2s ease-out both;}
.rk .sum-copy-btn.err .cp-in{animation:rkShake .3s ease-out both;}
.rk .sum-copy-btn.back .cp-in{animation:rkDown .2s ease-out both;}
.rk .cp-draw{stroke-dasharray:24;animation:rkDraw .28s .08s ease-out both;}
.sum-copy-note{font-size:12px;color:var(--bad);margin-right:8px;}
@keyframes rkPress{0%{transform:scale(1)}40%{transform:scale(.94)}100%{transform:scale(1)}}
@keyframes rkUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rkDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes rkShake{0%{opacity:0}30%{opacity:1;transform:translateX(-3px)}55%{transform:translateX(3px)}80%{transform:translateX(-2px)}100%{opacity:1;transform:none}}
@keyframes rkDraw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}

/* my status */
.rk-me{border-top:3px solid var(--me);padding:18px 20px;display:flex;flex-direction:column;gap:12px;flex:1;}
.rk-me-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.rk-eye-me{color:var(--me);}
.rk-me-name{font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-me-set{display:flex;flex-direction:column;gap:8px;}
.rk-me-lbl{font-size:13px;color:var(--muted);}
.rk-me-row{display:flex;gap:8px;}
.rk-me-row .rk-input{flex:1;}
.rk-me-body{display:flex;flex-direction:column;gap:12px;}
.rk-me-body[hidden],.rk-me-set[hidden]{display:none;}
.rk-me-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.rk-me-rank{font-family:'Space Mono',monospace;font-size:40px;font-weight:700;line-height:1;color:var(--ink);}
.rk-me-pts{font-family:'Space Mono',monospace;font-size:15px;color:var(--muted);}
.rk-me-d{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;}
.rk-me-pick{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--surface2);
    border-radius:10px;font-size:14px;color:var(--ink);}
.rk-me-pick:empty{display:none;}

/* daily killers */
.rk .dk-box{max-width:none;margin:0;border-radius:12px;border-top:3px solid var(--bad);}
.rk .dk-toggle{min-height:48px;justify-content:space-between;background:var(--surface);padding:12px 20px;color:var(--ink);}
.rk .dk-toggle-txt{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:700;}
.rk .dk-toggle-txt::before{content:"KILLERS · DAILY";display:block;font-family:'Space Mono',monospace;font-size:11px;
    font-weight:700;letter-spacing:.2em;color:var(--bad);text-align:left;margin-bottom:2px;}
.rk .dk-arrow{color:var(--primary-dark);}
.rk .dk-hd,.rk .dk-row{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);padding-left:20px;padding-right:20px;}
.rk .dk-hd{font-size:11px;color:var(--muted);}
.rk .dk-day{font-size:12px;color:var(--muted);}
.rk .dk-k em{font-size:12px;color:var(--bad);}
.rk .dk-k.alt em{color:var(--muted);}
.rk .dk-k.alt b{font-weight:400;}

/* table card toolbars */
.rk-tcard{overflow:visible;}
.rk-share{padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--me-dim);border-bottom:1px solid var(--me-rim);
    border-radius:12px 12px 0 0;font-size:13px;color:var(--ink);}
.rk-share[hidden]{display:none;}
.rk-watch{padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--star-dim);border-bottom:1px solid var(--star-rim);}
.rk-share:not([hidden])+.rk-watch{border-radius:0;}
.rk-share[hidden]+.rk-watch{border-radius:12px 12px 0 0;}
.rk-watch-t{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);margin-right:4px;}
.rk-star-ic svg{fill:var(--star);stroke:var(--star);}
.rk-watch-tabs,.rk-watch-new{display:contents;}
.rk-tab,.rk-chip{flex-shrink:0;white-space:nowrap;}
.rk-tab{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--star-rim);background:var(--surface);color:var(--muted);font-size:11px;
    transition:background-color .15s,color .15s;}
.rk-tab[aria-pressed="true"]{background:var(--star);border-color:var(--star);color:#051420;font-weight:700;}
.rk-tab .n{font-family:'Space Mono',monospace;opacity:.75;margin-left:4px;}
.rk-tab-new{border-style:dashed;border-color:var(--border);background:transparent;color:var(--muted);}
.rk-new-form{display:inline-flex;gap:6px;align-items:center;}
.rk-new-form .rk-input{min-height:36px;width:140px;}
.rk-share-btn{margin-left:auto;}
.rk-manage{padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--border2);}
.rk-manage[hidden]{display:none;}
.rk-manage .rk-input{min-height:36px;}
.rk-chips{padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--border2);}
.rk-chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.rk-chip{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:11px;
    transition:background-color .15s,color .15s;}
.rk-chip .n{font-family:'Space Mono',monospace;opacity:.8;margin-left:4px;}
.rk-chip[aria-pressed="true"]{background:var(--me);border-color:var(--me);color:#fff;font-weight:700;}
body.dark .rk-chip[aria-pressed="true"]{color:#06142a;}
.rk-route{padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--me-dim);border-bottom:1px solid var(--border2);}
.rk-route-t{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--me);}
.rk-route-if{font-size:12px;color:var(--muted);}
.rk-route-sel{display:contents;}
.rk-route-hint{margin-left:auto;font-size:12px;color:var(--muted);}
.rk-dd{position:relative;}
.rk-dd-btn{min-height:40px;min-width:180px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--drop-bg);color:var(--ink);
    font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.rk-dd-btn.on{border-color:var(--me);}
.rk-chev{display:inline-block;transition:transform .2s;}
.rk-dd-btn[aria-expanded="true"] .rk-chev{transform:rotate(180deg);}
.rk-selchip{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:700;padding:0 2px 0 12px;min-height:36px;border-radius:999px;
    background:var(--me-dim);color:var(--me);border:1px solid var(--me-rim);animation:rkPop .18s ease-out both;}
.rk-selchip button{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;}
.rk-route-res{display:inline-flex;align-items:center;gap:6px;font-size:13px;min-height:36px;padding:0 14px;border-radius:999px;background:var(--me);color:#fff;}
body.dark .rk-route-res{color:#06142a;}
.rk-route-res[hidden]{display:none;}

/* popovers */
.rk-pop{position:absolute;z-index:60;background:var(--drop-bg);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 10px 28px rgba(5,20,32,.16);padding:8px;display:flex;flex-direction:column;gap:2px;animation:rkPop .18s ease-out both;}
body.dark .rk-pop{box-shadow:0 10px 28px rgba(0,0,0,.5);}
.rk-pop[hidden]{display:none;}
.rk-dd-pop{top:46px;left:0;width:260px;}
.rk-pop-eye{padding:6px 8px;}
.rk-pop-search{margin:0 4px 4px;}
.rk-opts{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;}
.rk-opt{min-height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;text-align:left;display:flex;align-items:center;gap:10px;
    color:var(--ink);font-size:14px;}
.rk-opt:hover{background:var(--row-hover);}
.rk-box{width:18px;height:18px;flex-shrink:0;border-radius:5px;border:1.5px solid var(--border);background:var(--surface);position:relative;}
.rk-opt[aria-selected="true"] .rk-box,.rk-opt[aria-pressed="true"] .rk-box{background:var(--me);border-color:var(--me);}
.rk-opt[aria-selected="true"] .rk-box::after,.rk-opt[aria-pressed="true"] .rk-box::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.rk-picker .rk-opt[aria-pressed="true"] .rk-box{background:var(--star);border-color:var(--star);}
.rk-opt-l{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-pop-ft{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border2);margin-top:4px;padding-top:4px;}
.rk-picker{width:232px;}
.rk-picker .rk-pick-new{display:flex;gap:6px;padding:4px;}
.rk-picker .rk-pick-new .rk-input{flex:1;min-height:36px;}
.rk-pick-act{min-height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;text-align:left;color:var(--primary-dark);font-size:13px;}
.rk-pick-act:hover{background:var(--row-hover);}
.rk-pick-me{color:var(--me);font-weight:700;}
@keyframes rkPop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* table */
.rk .table-wrapper{border:0;border-radius:0;max-height:calc(100vh - 96px);overflow:auto;overscroll-behavior:contain;}
.rk .filterable-table{font-size:14px;}
.rk .filterable-table thead tr:first-child th{font-family:'Noto Sans SC',sans-serif;font-size:12px;font-weight:700;letter-spacing:0;
    text-transform:none;color:#fff;padding:12px 10px;}
.rk .filterable-table td{font-size:14px;padding:9px 10px;white-space:nowrap;}
.rk .filterable-table td:nth-child(3),.rk .filterable-table td:nth-child(4){font-family:inherit;font-weight:inherit;color:inherit;font-size:14px;}
.rk .filterable-table td:first-child{font-family:'Space Mono',monospace;font-weight:700;color:var(--ink);font-size:14px;}
.rk .filter-trigger{min-height:28px;font-size:11px;color:var(--muted);border-radius:8px;padding:0 8px;font-family:'Noto Sans SC',sans-serif;}
.rk .filterable-table tr:nth-child(even) td{background:transparent;}
.rk .filterable-table tr:hover td,.rk .filterable-table tr:nth-child(even):hover td{background:var(--row-hover);}
.rk .filterable-table .rk-frz{position:sticky;z-index:2;background:var(--surface);}
.rk .filterable-table thead .rk-frz{z-index:22;}
.rk .filterable-table thead tr:first-child .rk-frz{background:var(--th-bg);}
.rk .filterable-table .filter-row .rk-frz{background:var(--filter-bg);}
/* frozen cells must stay opaque on every row (beats the even-row / hover / "me" tints) */
.rk .filterable-table tbody tr td.rk-frz{background:var(--surface);}
.rk .filterable-table tbody tr:hover td.rk-frz{background:linear-gradient(var(--row-hover),var(--row-hover)) var(--surface);}
.rk .filterable-table tbody tr.rk-mine td.rk-frz{background:linear-gradient(var(--me-dim),var(--me-dim)) var(--surface);}
.rk .filterable-table .rk-frz-last{box-shadow:6px 0 8px -6px rgba(5,20,32,.18);}
.rk .rank{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;display:inline-block;}
.rk .rank.up{color:var(--ok);}.rk .rank.down{color:var(--bad);}.rk .rank.same{color:var(--muted);}
.rk .rank::before{content:none;}
.rank-a::after{content:attr(data-a);margin-left:6px;font-size:12px;}
.rk .filterable-table tbody tr.rk-final td,.rk .filterable-table tbody tr.rk-final td.rk-frz{background:linear-gradient(var(--fin-dim),var(--fin-dim)) var(--surface);}
.rk .filterable-table tbody tr.rk-final:hover td,.rk .filterable-table tbody tr.rk-final:hover td.rk-frz{background:linear-gradient(var(--fin-dim),var(--fin-dim)) var(--surface2);}
.rk tr.rk-final td:first-child{box-shadow:inset 3px 0 0 var(--fin);}
.rk tr.rk-final-last td{border-bottom:1px dashed var(--fin-rim);}
.rk-finals-note{display:flex;align-items:center;gap:8px;padding:8px 20px;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--border2);}
.rk-finals-note[hidden]{display:none;}
.rk-f{width:14px;height:14px;border-radius:4px;background:var(--fin-dim);box-shadow:inset 3px 0 0 var(--fin);flex-shrink:0;}
.rk-card-row.rk-final{box-shadow:inset 3px 0 0 var(--fin);background-image:linear-gradient(var(--fin-dim),var(--fin-dim));}
.rk-c-cur{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);}
.rk-c-cur b{color:var(--ink);}

/* help button + dialogs */
.rk-help-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--me,#1c3f94);
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s ease-out;}
.rk-help-btn:hover{transform:scale(1.06);}
.rk-help-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
body.dark .rk-help-btn{color:#8fb0ff;}
.rk-modal{position:fixed;inset:0;z-index:9000;background:rgba(5,20,32,.45);display:flex;align-items:center;justify-content:center;padding:20px;
    animation:rkFade .2s ease-out both;}
.rk-modal[hidden]{display:none;}
.rk-dlg{width:min(600px,100%);max-height:min(88vh,860px);background:var(--surface);border-radius:14px;box-shadow:0 18px 50px rgba(5,20,32,.25);
    display:flex;flex-direction:column;overflow:hidden;animation:rkRise .26s cubic-bezier(.22,.68,0,1.2) both;outline:0;}
.rk-dlg-hist{border-top:3px solid var(--tour);}
.rk-dlg-help{border-top:3px solid var(--me);width:min(560px,100%);}
.rk-ask{width:min(420px,100%);border-top:3px solid var(--bad);}
.rk-ask h2{white-space:normal;font-size:18px;}
.rk-ask-d{margin:0;padding:0 20px 16px;font-size:14px;line-height:1.6;color:var(--muted);}
.rk-ask-ok{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700;}
.rk-ask-ok:hover{color:#fff;border-color:var(--bad);filter:brightness(1.08);}
body.dark .rk-ask-ok{color:#1a0904;}
.rk-dlg-hd{display:flex;justify-content:space-between;gap:12px;padding:18px 20px 12px;}
.rk-dlg-ttl{display:flex;flex-direction:column;gap:4px;min-width:0;}
.rk-dlg-ttl h2{margin:0;font-family:'Noto Serif SC',serif;font-size:22px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-eye-tour{color:var(--tour);}
.rk-dlg-act{display:flex;align-items:flex-start;gap:10px;flex-shrink:0;}
.rk-hist-seg{display:flex;gap:3px;padding:3px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;}
.rk-hist-seg button{min-height:36px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:13px;font-weight:700;
    transition:background-color .18s,color .18s;}
.rk-hist-seg button[aria-pressed="true"]{background:#1c3f94;color:#fff;}
.rk-hist-seg button:disabled{opacity:.45;cursor:not-allowed;}
.rk-x{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--ink);
    display:flex;align-items:center;justify-content:center;}
.rk-hist-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 20px 14px;}
.rk-hist-stats>span{background:var(--surface2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);min-width:0;}
.rk-hist-stats b{font-family:'Space Mono',monospace;font-size:18px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-hist-stats .st-badge{align-self:flex-start;margin-top:3px;}
.rk-hist-head,.rk-hist-row{display:grid;grid-template-columns:64px minmax(0,1fr) 110px;gap:10px;padding:8px 20px;align-items:center;}
.rk-hist-head{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface2);border-top:1px solid var(--border2);}
.rk-hist-list{overflow-y:auto;}
.rk-hist-row{font-size:14px;border-top:1px solid var(--border2);color:var(--ink);animation:rkRow .24s ease-out both;}
.rk-hist-row.today{background:var(--star-dim);}
.rk-hist-row b{font-family:'Space Mono',monospace;font-size:13px;}
.rk-hist-row .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;}
.rk-hist-row .p.none{color:var(--muted);font-weight:400;}
.rk-hist-row .a{margin-left:8px;font-size:12px;font-weight:400;color:var(--muted);}
.rk-hist-ft{padding:12px 20px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.rk-dlg-ft{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--border);}
.rk-dlg-nav{display:flex;gap:8px;}
.rk-dlg-nav .rk-btn[disabled]{opacity:.4;cursor:default;}
.hp-bars{display:flex;gap:6px;padding:0 20px 14px;}
.hp-bar{flex:1;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;}
.hp-bar i{display:block;height:100%;background:var(--me);transform-origin:left;transform:scaleX(0);}
.hp-bar.done i{transform:none;}
.hp-bar.now i{animation:hpFill 5s linear both;}
.hp-bar.now.paused i{animation-play-state:paused;}
.hp-body{padding:0 20px 18px;}
.hp-step{display:flex;flex-direction:column;gap:12px;animation:hpIn .3s ease-out both;}
.hp-step[hidden]{display:none;}
.hp-step h3{margin:4px 0 0;font-family:'Noto Serif SC',serif;font-size:18px;color:var(--ink);}
.hp-step p{margin:0;font-size:15px;line-height:1.7;color:var(--ink2);}
.hp-stage{position:relative;height:220px;border-radius:12px;background:var(--surface2);border:1px solid var(--border2);overflow:hidden;padding:16px;
    display:flex;flex-direction:column;gap:12px;font-size:13px;color:var(--ink);}
.hp-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.hp-chip{position:relative;display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);}
.hp-chip.on{background:var(--me);border-color:var(--me);color:#fff;font-weight:700;}
.hp-chip.gold{background:var(--star);border-color:var(--star);color:#051420;font-weight:700;}
.hp-ping{position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--me);animation:hpPing 1.4s ease-out infinite;}
.hp-lines{display:flex;flex-direction:column;gap:6px;}
.hp-lines i{height:26px;border-radius:8px;background:var(--surface);}
.hp-lines i:last-child{opacity:.5;}
.hp-foot{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--muted);}
.hp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
.hp-grid b{font-size:12px;padding:7px 8px;border-radius:8px;background:var(--th-bg);color:#fff;}
.hp-grid span{font-size:12px;padding:6px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hp-grid span.on{border-color:var(--me);color:var(--me);font-weight:700;}
.hp-menu{position:absolute;left:calc(50% + 4px);top:96px;width:150px;background:var(--drop-bg);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 8px 20px rgba(5,20,32,.12);padding:8px;display:flex;flex-direction:column;gap:6px;animation:hpMenu 2.4s ease-in-out infinite;}
.hp-menu-l{left:40px;top:120px;}
.hp-ck::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid var(--border);margin-right:8px;vertical-align:-1px;}
.hp-ck.on::before{background:var(--me);border-color:var(--me);}
.hp-cur{position:absolute;left:40px;top:120px;width:18px;height:18px;fill:var(--ink);animation:hpCur 2.4s ease-in-out infinite;}
.hp-blue{color:var(--me);font-weight:700;}
.hp-gold{color:var(--star);}
.hp-dd{min-height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--me);background:var(--surface);display:inline-flex;align-items:center;}
.hp-sel{min-height:30px;padding:0 12px;border-radius:999px;background:var(--me-dim);color:var(--me);font-weight:700;display:inline-flex;align-items:center;}
.hp-list{display:flex;flex-direction:column;gap:6px;}
.hp-list span{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;border-radius:8px;background:var(--surface);}
.hp-list em{font-style:normal;color:var(--ok);font-family:'Space Mono',monospace;}
.hp-list em.up{color:var(--ok);}.hp-list em.down{color:var(--bad);}
.hp-list .gone{opacity:.4;text-decoration:line-through;animation:hpGone 2.4s ease-in-out infinite;}
.hp-list .me{background:var(--me-dim);box-shadow:inset 3px 0 0 var(--me);}
.hp-me{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--me);color:#fff !important;}
.hp-tag{color:var(--star) !important;font-family:inherit !important;font-size:11px;}
.hp-bump{background:rgba(196,152,0,.18) !important;animation:hpBump 1.2s cubic-bezier(.22,.68,0,1) infinite alternate;position:relative;z-index:1;}
.hp-seg{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:var(--surface);border:1px solid var(--border);}
.hp-seg i{font-style:normal;font-size:11px;padding:3px 10px;border-radius:999px;color:var(--muted);}
.hp-seg i.on{background:#1c3f94;color:#fff;font-weight:700;}
.hp-bd{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:14px;align-items:center;}
.hp-bd-list{display:flex;flex-direction:column;gap:6px;}
.hp-bd-list span{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;background:var(--surface);font-size:12px;}
.hp-bd-list b{font-family:'Space Mono',monospace;}
.hp-bd-list .s-hard{box-shadow:inset 3px 0 0 #0088bb;}.hp-bd-list .s-clay{box-shadow:inset 3px 0 0 #d0573a;}.hp-bd-list .s-grass{box-shadow:inset 3px 0 0 #1b5e37;}
.hp-donut{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(#0088bb 0 65%,#d0573a 0 88%,#1b5e37 0 100%);animation:hpSpin 2.4s cubic-bezier(.22,.68,0,1) infinite alternate;}
.hp-donut b{width:70px;height:70px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;
    font-family:'Space Mono',monospace;font-size:14px;color:var(--ink);}
@keyframes hpSpin{from{transform:rotate(-90deg) scale(.85);opacity:.4}to{transform:none;opacity:1}}
.hp-bars-demo{display:flex;flex-direction:column;gap:8px;}
.hp-bars-demo i{display:block;height:12px;border-radius:6px;background:var(--primary);transform-origin:left;animation:hpGrow 1.6s ease-out infinite alternate;}
.hp-bars-demo i:nth-child(2){background:var(--secondary);}
.hp-bars-demo i:nth-child(3){opacity:.5;}
@keyframes hpGrow{from{transform:scaleX(.2)}to{transform:none}}
.hp-ok{min-height:32px;padding:0 14px;border-radius:999px;background:var(--ok);color:#fff;font-weight:700;display:inline-flex;align-items:center;}
@keyframes rkFade{from{opacity:0}to{opacity:1}}
@keyframes rkRise{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes rkRow{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes hpIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes hpFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes hpPing{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@keyframes hpCur{0%{transform:translate(0,0)}40%,100%{transform:translate(210px,-26px)}}
@keyframes hpMenu{0%,40%{opacity:0;transform:translateY(-4px)}55%,100%{opacity:1;transform:none}}
@keyframes hpGone{0%,30%{opacity:1;text-decoration:none}60%,100%{opacity:.4}}
@keyframes hpBump{from{transform:translateY(40px)}to{transform:none}}
.rk-user{display:flex;align-items:center;gap:6px;min-width:0;}
.rk-star{width:36px;height:36px;margin:-6px 0 -6px -6px;border:0;border-radius:50%;background:transparent;display:inline-flex;align-items:center;
    justify-content:center;flex-shrink:0;}
.rk-star svg{fill:none;stroke:var(--star);}
.rk-star.on svg{fill:var(--star);}
.rk-star:hover{background:var(--star-dim);}
.rk-uname{text-decoration:underline;text-decoration-color:var(--primary-rim);text-underline-offset:3px;}
.rk-mebadge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--me);color:#fff;}
body.dark .rk-mebadge{color:#06142a;}
.rk-tags{font-size:11px;color:var(--star);white-space:nowrap;}
.rk-tags::after{content:attr(data-t);}
.rk-uname[data-me]::after{content:"我";display:inline-block;margin-left:6px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;
    background:var(--me);color:#fff;text-decoration:none;}
body.dark .rk-uname[data-me]::after{color:#06142a;}
body:not(.dark) .rk-tags{color:#8a6a00;}
.rk .filterable-table tr.rk-mine td{background:var(--me-dim);}
.rk .filterable-table tr.rk-mine td:first-child{box-shadow:inset 3px 0 0 var(--me);}
.rk .filterable-table tbody tr.rk-pg,.rk-cards .rk-pg{display:none !important;}
.rk-empty{padding:32px;text-align:center;font-size:13px;color:var(--muted);}
.rk-empty[hidden]{display:none;}
.rk-foot{padding:12px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--border2);font-size:13px;color:var(--muted);}
.rk-count{margin-left:auto;}
.rk-count b{font-family:'Space Mono',monospace;color:var(--ink);}
.rk-foot #rkMore{color:var(--primary-dark);}
.rk-foot #rkMore[hidden]{display:none;}

/* rank-change motion (load + replay); transform/opacity only */
@keyframes rkMv{from{transform:translateY(var(--dy,0))}to{transform:none}}
@keyframes rkMv2{from{transform:translateY(var(--dy,0))}to{transform:none}}
@keyframes rkFlash{from{box-shadow:inset 0 0 0 999px var(--primary-rim)}to{box-shadow:inset 0 0 0 999px transparent}}
@keyframes rkDp{0%{opacity:0;transform:translateY(var(--dd,0)) scale(.7)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}
@keyframes rkDp2{0%{opacity:0;transform:translateY(var(--dd,0)) scale(.7)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}
.rk tr.rk-mv0,.rk .rk-card-row.rk-mv0{animation:rkMv 1.3s cubic-bezier(.22,.68,0,1) both;position:relative;z-index:1;}
.rk tr.rk-mv1,.rk .rk-card-row.rk-mv1{animation:rkMv2 1.3s cubic-bezier(.22,.68,0,1) both;position:relative;z-index:1;}
.rk tr.rk-mv0 td,.rk tr.rk-mv1 td{animation:rkFlash 2.4s ease-out;}
.rk .rk-dp0{animation:rkDp .6s 1.1s ease-out both;}
.rk .rk-dp1{animation:rkDp2 .6s 1.1s ease-out both;}

/* mobile cards */
.rk-cards{display:none;flex-direction:column;gap:8px;padding:12px;}
.rk-card-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;}
.rk-card-row.rk-mine{background:var(--me-dim);border-color:var(--me-rim);}
.rk-card-main{display:flex;align-items:stretch;}
.rk-card-btn{flex:1;min-width:0;font:inherit;color:inherit;border:0;background:transparent;padding:12px 4px 12px 14px;display:grid;
    grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;min-height:60px;}
.rk-c-rank{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;display:flex;flex-direction:column;gap:2px;}
.rk-c-rank .rank{font-size:11px;}
.rk-c-mid{display:flex;flex-direction:column;gap:4px;min-width:0;}
.rk-c-name{display:flex;gap:6px;align-items:center;min-width:0;font-weight:700;font-size:15px;}
.rk-c-name .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-c-sub{display:flex;gap:6px;align-items:center;min-width:0;font-size:12px;color:var(--muted);}
.rk-c-sub .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-c-sub .p b{color:var(--ink);font-weight:500;}
.rk-c-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.rk-c-pts{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;}
.rk-card-row .rk-star{margin:0 8px 0 0;align-self:center;width:44px;height:44px;}
.rk-c-more{margin:0 14px;padding:12px 0 14px 40px;border-top:1px solid var(--border2);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px 12px;font-size:12px;color:var(--muted);animation:rkPop .18s ease-out both;}
.rk-c-more[hidden]{display:none;}
.rk-c-more span{display:flex;flex-direction:column;gap:2px;min-width:0;}
.rk-c-more b{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-c-more .rk-btn{grid-column:1/-1;min-height:44px;}

@media(hover:hover){.rk .sum-box:hover,.rk-me:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(5,20,32,.08);}}
@media(max-width:1000px){.rk-top{grid-template-columns:minmax(0,1fr);}}
@media(max-width:720px){
    .rk{gap:14px;}
    .rk-eye{font-size:13px;letter-spacing:.14em;}
    .rk .sum-title::before,.rk .dk-toggle-txt::before{font-size:13px;letter-spacing:.14em;}
    .rk .sum-header{padding:14px 16px 10px;}
    .rk .sum-col-hd,.rk .sbar-row,.rk .sbar-bak{padding-left:16px;padding-right:16px;}
    .rk-me{padding:12px 14px;gap:8px;}
    .rk-me-set{gap:6px;}
    .rk-me-lbl,.rk-me-set .rk-note{display:none;}
    .rk-me-body{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px 12px;}
    .rk-me-body[hidden]{display:none;}
    .rk-me-big{gap:8px;}
    .rk-me-rank{font-size:26px;}
    .rk-me-pick{grid-column:1/-1;padding:8px 10px;font-size:13px;}
    .rk-me-big{grid-column:1/2;grid-row:1;}
    .rk-me-body .rk-btn-block{grid-column:2/3;grid-row:1;justify-self:end;width:auto;min-height:40px;padding:0 12px;font-size:12px;}
    .rk-me-body .rk-btn-text{grid-column:1/-1;justify-self:start;min-height:32px;padding:0;}
    .rk-watch,.rk-chips,.rk-route,.rk-manage,.rk-share{padding:10px 12px;}
    .rk-watch,.rk-chip-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
    .rk-watch>*,.rk-chip-row>*{flex-shrink:0;}
    .rk-chip-row{width:100%;}
    .rk-share-btn{margin-left:0;}
    .rk-route-hint{margin-left:0;flex-basis:100%;}
    .rk-dd-pop{width:min(280px,calc(100vw - 48px));}
    .rk .table-wrapper{display:none;}
    .rk-cards{display:flex;}
    .rk-foot{flex-wrap:wrap;padding:12px;}
    .rk-count{margin-left:0;}
}
@media(max-width:720px){
    .rk-modal{align-items:flex-end;padding:0;}
    .rk-dlg{width:100%;max-height:92vh;border-radius:16px 16px 0 0;}
    .rk-hist-stats{grid-template-columns:repeat(2,minmax(0,1fr));}
    .rk-hist-head,.rk-hist-row{grid-template-columns:52px minmax(0,1fr) 96px;padding-left:16px;padding-right:16px;}
    .hp-stage{height:200px;}
    .rk-dlg-ft{flex-wrap:wrap;}
}
@media(prefers-reduced-motion:reduce){
    .rk *,.rk-pop,.rk-modal,.rk-modal *{animation:none !important;transition:none !important;}
    .hp-bar.now i{transform:none;}
}
.page-header{--tour:#1c3f94;}
body.dark .page-header{--tour:#8fb0ff;}
.page-header .page-eye{color:var(--tour);font-size:11px;font-weight:700;letter-spacing:.24em;}
.page-title .ttag:empty{display:none;}
.wl-count{font-family:'Space Mono',monospace;font-size:13px;font-weight:400;color:var(--muted);}
.wl-count:empty{display:none;}
.wl-share-wrap{margin-left:auto;display:inline-flex;align-items:center;gap:10px;}
.wl-share-wrap[hidden]{display:none;}
.wl-share-note{font-family:'Noto Sans SC',sans-serif;font-size:12px;font-weight:400;color:var(--ok);}
.wl-share-note.err{color:var(--bad);}
.page-header,.wl{--ok:#1e6b47;--bad:#9a3a28;--bad-bg:#f8e3dd;}
body.dark .page-header,body.dark .wl{--ok:#7dcea0;--bad:#ff9a7a;--bad-bg:rgba(255,122,84,.12);}
.wl-share{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:150px;padding:0 18px;border-radius:999px;
    border:1px solid var(--border);background:var(--surface);color:var(--ink);font-family:'Noto Sans SC',sans-serif;font-size:13px;font-weight:700;
    cursor:pointer;overflow:hidden;transition:background-color .2s ease-out,border-color .2s ease-out,color .2s ease-out;}
.wl-share:hover{border-color:var(--primary-rim);color:var(--primary-dark);}
.wl-share:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.wl-share .cp-in{display:inline-flex;align-items:center;gap:6px;}
.wl-share.ok{background:var(--ok);border-color:var(--ok);color:#fff;animation:rkPress .24s ease-out;}
body.dark .wl-share.ok{color:#06140c;}
.wl-share.err{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}
.wl-share.ok .cp-in{animation:rkUp .2s ease-out both;}
.wl-share.err .cp-in{animation:rkShake .3s ease-out both;}
.wl-share.back .cp-in{animation:rkDown .2s ease-out both;}
.wl-share .cp-draw{stroke-dasharray:24;animation:rkDraw .28s .08s ease-out both;}
.wl[hidden],.wl [hidden]{display:none !important;}

/* toolbar */
.wl-bar{overflow:visible;}
.wl-bar .rk-watch{border-radius:12px;border-bottom:0;}
.wl-bar .rk-watch:has(+.rk-manage:not([hidden])){border-radius:12px 12px 0 0;border-bottom:1px solid var(--star-rim);}
.wl .rk-tab{min-height:40px;padding:0 14px;font-size:13px;}
.wl .rk-new-form .rk-input{min-height:40px;}
.wl-add{margin-left:auto;position:relative;}
.wl-add-box{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 4px 0 14px;border-radius:999px;border:1px solid var(--border);
    background:var(--drop-bg);color:var(--muted);}
.wl-add-box:focus-within{border-color:var(--primary);}
.wl-add-box input{border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);width:180px;min-width:0;}
.wl-add-box .rk-btn{min-height:32px;}
.wl-sug{top:46px;right:0;width:280px;}
.wl-sug .rk-opt{justify-content:space-between;}
.wl-sug .rk-opt[aria-selected="true"]{background:var(--row-hover);}
.wl-sug .t{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);flex-shrink:0;}
.wl-sug .rk-note{padding:6px 10px;}
.wl-manage-t{flex:1;font-size:13px;color:var(--muted);}
.wl-manage-t b{font-family:'Noto Serif SC',serif;font-size:15px;color:var(--ink);}

/* share-link import + first visit */
.wl-share-in{border:1px solid var(--me-rim);border-top:3px solid var(--me);padding:18px 20px;display:flex;flex-direction:column;gap:12px;}
.wl-share-in h2,.wl-start h2{margin:0;font-family:'Noto Serif SC',serif;font-size:18px;color:var(--ink);}
.wl-share-in .rk-eye{color:var(--me);}
.wl-lists{display:flex;flex-wrap:wrap;gap:8px;}
.wl-lists span{padding:4px 12px;border-radius:999px;background:var(--star-dim);color:var(--ink2);font-size:13px;}
.wl-lists b{font-family:'Space Mono',monospace;font-weight:400;}
.wl-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.wl-start{padding:28px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;max-width:640px;}
.wl-start-ic svg{width:40px;height:40px;fill:none;stroke:var(--star);stroke-width:1.6;}
.wl-start p{margin:0;font-size:14px;line-height:1.7;color:var(--muted);}
.wl-me-form{width:100%;display:flex;flex-direction:column;gap:6px;}
.wl-me-row{display:flex;gap:8px;}
.wl-me-row .rk-input{flex:1;min-height:44px;}
.wl-start-act{display:flex;flex-wrap:wrap;gap:10px;}
.wl-start-act a{text-decoration:none;}

/* cards */
.wl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.wl-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 18px 18px;display:flex;flex-direction:column;gap:12px;
    min-width:0;transition:transform .2s ease-out,box-shadow .2s ease-out;}
.wl-card.hov{transform:translateY(-2px);box-shadow:0 6px 18px rgba(5,20,32,.08);}
body.dark .wl-card.hov{box-shadow:0 6px 18px rgba(0,0,0,.4);}
.wl-card.me{border-color:var(--me-rim);box-shadow:inset 3px 0 0 var(--me);}
.wl-card.me.hov{box-shadow:inset 3px 0 0 var(--me),0 6px 18px rgba(5,20,32,.08);}
.wl-hd{display:flex;align-items:center;gap:8px;min-width:0;}
.wl-name{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700;color:var(--ink);border:0;background:transparent;padding:0;min-height:44px;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--primary-rim);text-underline-offset:4px;}
.wl-name:hover{color:var(--primary-dark);}
.wl-hd .rk-mebadge{flex-shrink:0;}
.wl-hd .rk-tags{overflow:hidden;text-overflow:ellipsis;font-size:12px;}
.wl-gone{margin-left:auto;flex-shrink:0;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--bad-bg);color:var(--bad);}
.wl-rm{margin-left:auto;flex-shrink:0;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);
    display:flex;align-items:center;justify-content:center;}
.wl-gone+.wl-rm{margin-left:0;}
.wl-rm:hover{background:var(--bad-bg);color:var(--bad);}
.wl-tours{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.wl-t{--c:var(--secondary);--eye:color-mix(in srgb,var(--secondary) 62%,var(--ink));border:1px solid var(--border);border-top:3px solid var(--c);border-radius:10px;
    padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface);color:var(--ink);text-decoration:none;}
.wl-t[data-t="WTA"]{--c:var(--primary);--eye:var(--primary-dark);}
body.dark .wl-t{--eye:var(--c);}
.wl-t.off{background:var(--surface2);}
.wl-t.lost{background:color-mix(in srgb,var(--bad-bg) 35%,var(--surface));}
.wl-t-eye{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--eye);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wl-t-big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.wl-t-rank{font-family:'Space Mono',monospace;font-size:28px;font-weight:700;line-height:1.1;}
.wl-t.lost .wl-t-rank{color:var(--muted);}
.wl-t-big .rank{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;}
.wl-t-big .rank.up{color:var(--ok);}.wl-t-big .rank.down{color:var(--bad);}.wl-t-big .rank.same{color:var(--muted);}
.wl-t-pts{margin-left:auto;font-family:'Space Mono',monospace;font-size:14px;color:var(--ink2);}
.wl-t-pts small{font-family:'Noto Sans SC',sans-serif;font-size:11px;color:var(--muted);}
.wl-t .st-badge{align-self:flex-start;}
.wl-t-pk{display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 8px;font-size:13px;}
.wl-t-pk span{color:var(--muted);}
.wl-t-pk b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wl-t-pk b.alt{font-weight:400;color:var(--muted);}
.wl-t-kill{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--bad);min-width:0;}
.wl-t-kill svg{flex-shrink:0;}
.wl-t-msg{font-size:13px;color:var(--muted);padding:6px 0;}
.wl-t-go{margin-top:auto;display:flex;align-items:center;gap:4px;min-height:32px;font-size:12px;color:var(--primary-dark);}
body.dark .wl-t-go{color:var(--primary);}
a.wl-t-go:hover{text-decoration:underline;}
